<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12130f" media="(prefers-color-scheme: dark)" />
    <title>Luna Blog · 记录生活与代码</title>
    <meta name="description" content="Luna Blog — 一个记录技术、生活与思考的数字花园。" />
    <meta name="keywords" content="博客,前端,技术,随笔" />
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('luna-theme') || 'dark'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* 首屏主题预置失败时保持默认亮色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

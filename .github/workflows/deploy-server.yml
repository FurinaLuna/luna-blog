name: deploy-server

# 改了后端代码 → 自动自检、打包并发布到服务器
on:
  push:
    branches: [main]
    paths:
      - 'blog-server/**'
      - 'deploy/ops/backend-release.sh'
      - 'deploy/ops/lib.sh'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.LUNA_SSH_HOST }}
  SSH_USER: ${{ secrets.LUNA_SSH_USER || 'ubuntu' }}
  SSH_PORT: ${{ secrets.LUNA_SSH_PORT || '22' }}
  REMOTE_ROOT: /var/www/luna-blog

jobs:
  deploy:
    name: build & release (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          set -euo pipefail
          [ -n "${{ secrets.LUNA_SSH_HOST }}" ] || { echo "::error::缺少仓库密钥 LUNA_SSH_HOST（Settings → Secrets and variables → Actions）"; exit 1; }
          [ -n "${{ secrets.LUNA_SSH_KEY }}" ] || { echo "::error::缺少仓库密钥 LUNA_SSH_KEY"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: blog-server/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm -C blog-server install --frozen-lockfile

      - name: Self-check (back-end build gate)
        run: |
          set -euo pipefail
          pnpm -C blog-server run build

      - name: Pack backend source
        run: |
          set -euo pipefail
          REV="${GITHUB_SHA::12}"
          echo "REV=$REV" >> "$GITHUB_ENV"
          tar -czf "luna-server-$REV.tgz" -C blog-server \
            --exclude=node_modules --exclude=dist --exclude=.env --exclude=uploads .
          ls -lh "luna-server-$REV.tgz"

      - name: Setup SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.LUNA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'echo SSH_OK'

      - name: Upload & release
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "luna-server-$REV.tgz" "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "rm -rf /tmp/luna-server-$REV && mkdir -p /tmp/luna-server-$REV && tar -xzf /tmp/luna-server-$REV.tgz -C /tmp/luna-server-$REV && rm -f /tmp/luna-server-$REV.tgz && sudo bash $REMOTE_ROOT/src/deploy/ops/backend-release.sh /tmp/luna-server-$REV"

      - name: Health check
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            'curl -fsS --max-time 5 http://127.0.0.1/api/health'

name: deploy-docker

# Build the api + web images and publish them to GHCR, then switch the
# server-side Docker Compose stack to the new tag (atomic, health-checked).
on:
  push:
    branches: [main]
    paths:
      - 'blog-web/**'
      - 'blog-admin/**'
      - 'blog-server/**'
      - 'docker/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/ops/docker-release.sh'
      - '.github/workflows/deploy-docker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/luna-blog-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/luna-blog-web
  SSH_HOST: ${{ secrets.LUNA_SSH_HOST }}
  SSH_USER: ${{ secrets.LUNA_SSH_USER || 'ubuntu' }}
  SSH_PORT: ${{ secrets.LUNA_SSH_PORT || '22' }}
  REMOTE_ROOT: /var/www/luna-blog

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          {
            echo "### Docker images pushed"
            echo ""
            echo "- api: \`${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}\`"
            echo "- web: \`${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: release on server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LUNA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host luna
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync release script
        run: |
          scp deploy/ops/docker-release.sh luna:/tmp/docker-release.sh
          ssh luna "sudo -n install -d -m 755 ${REMOTE_ROOT}/src/deploy/ops && sudo -n install -m 755 /tmp/docker-release.sh ${REMOTE_ROOT}/src/deploy/ops/docker-release.sh"

      - name: Deploy tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | ssh luna "sudo -n docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh luna "sudo -n bash ${REMOTE_ROOT}/src/deploy/ops/docker-release.sh '$TAG'"
          ssh luna "cd ${REMOTE_ROOT} && sudo -n docker compose --env-file compose.env --env-file images.env ps"

      - name: Summary
        if: always()
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "### Docker release"
            echo ""
            echo "- tag: \`${TAG}\`"
            echo "- stack: ${REMOTE_ROOT} (compose: db + api + web)"
          } >> "$GITHUB_STEP_SUMMARY"

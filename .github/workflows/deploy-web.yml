name: deploy-web

# 改了前台 / 后台代码 → 自动构建并发布到服务器
on:
  push:
    branches: [main]
    paths:
      - 'blog-web/**'
      - 'blog-admin/**'
      - 'deploy/ops/build-local.sh'
      - 'deploy/ops/release.sh'
      - 'deploy/ops/lib.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.LUNA_SSH_HOST }}
  SSH_USER: ${{ secrets.LUNA_SSH_USER || 'ubuntu' }}
  SSH_PORT: ${{ secrets.LUNA_SSH_PORT || '22' }}
  REMOTE_ROOT: /var/www/luna-blog

jobs:
  deploy:
    name: build & release (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          set -euo pipefail
          [ -n "${{ secrets.LUNA_SSH_HOST }}" ] || { echo "::error::缺少仓库密钥 LUNA_SSH_HOST（Settings → Secrets and variables → Actions）"; exit 1; }
          [ -n "${{ secrets.LUNA_SSH_KEY }}" ] || { echo "::error::缺少仓库密钥 LUNA_SSH_KEY"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            blog-web/pnpm-lock.yaml
            blog-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm -C blog-web install --frozen-lockfile
          pnpm -C blog-admin install --frozen-lockfile

      - name: Build release tarball
        run: |
          set -euo pipefail
          VERSION="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)-gh${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" bash deploy/ops/build-local.sh
          test -f "build/release-$VERSION.tgz"

      - name: Setup SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.LUNA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'echo SSH_OK'

      - name: Upload & release
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "build/release-$VERSION.tgz" "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "sudo bash $REMOTE_ROOT/src/deploy/ops/release.sh $VERSION"

      - name: Health check
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            'curl -fsS --max-time 5 http://127.0.0.1/api/health'

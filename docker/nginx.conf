# =============================================================================
# nginx.conf — Luna Blog 容器内站点配置（web 容器）
#
# 与宿主机版 deploy/nginx/luna-blog.conf 保持同一套规则，差异：
#   * 后端 upstream 指向 compose 网络里的 api 容器（app-api:3000）
#   * 后台/管理 API 的 allow 名单额外放行 172.16.0.0/12（Docker 网关地址段），
#     这样 SSH 隧道（ssh -L 8080:127.0.0.1:80）经 docker 端口映射进来仍可访问
#   * /uploads/ 直接读挂载进来的上传目录（不经过 Node，省一次转发）
#
# 挂载约定：
#   /usr/share/nginx/html/web    站点静态产物（blog-web dist）
#   /usr/share/nginx/html/admin  后台静态产物（blog-admin dist，base=/admin/）
#   /data/uploads                上传文件（compose 里映射宿主机目录，只读）
# =============================================================================

# ---- 限流 zone（conf.d 被 include 进 http 块，合法）---------------------------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

# ---- 后端 upstream ----------------------------------------------------------
upstream app-api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html/web;
    index index.html;

    # 后端限制图片 5MB / 文件 10MB，这里留余量（超出由 Nginx 直接 413）
    client_max_body_size 12m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # 服务器级安全头；凡是自己写了 add_header 的 location 都要重新写这三行
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # 后台（Vue SPA，base=/admin/）
    # -------------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        root /usr/share/nginx/html;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /admin/ {
        root /usr/share/nginx/html;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=api_login burst=3 nodelay;
        limit_conn perip 5;
        proxy_pass http://app-api;
    }

    location ^~ /api/admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://app-api;
    }

    location ~ ^/api/(comments|messages|friend-links|visit|articles/[0-9]+/like|comments/[0-9]+/like|talks/[0-9]+/like|messages/[0-9]+/like)$ {
        limit_req zone=api_write burst=5 nodelay;
        limit_conn perip 10;
        proxy_pass http://app-api;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn perip 20;
        proxy_pass http://app-api;
    }

    # 反代公共设置（写在每个 proxy 位置之外，用 location 级 include 等价写法：
    # nginx 不支持 location 继承，这里统一在下面的 proxy 位置里重复声明，
    # 为避免遗漏，集中写成一个 internal location 是做不到的，故逐条写）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    # 本站前面没有可信 CDN/反代，直接用客户端地址，避免被伪造头污染
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_buffering off;

    # -------------------------------------------------------------------------
    # SEO / 订阅（由后端动态生成，必须反代，否则被 SPA 兜底成 HTML）
    # -------------------------------------------------------------------------
    location = /robots.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://app-api;
    }

    location = /sitemap.xml {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://app-api;
    }

    location = /rss.xml {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=1800" always;
        proxy_pass http://app-api;
    }

    location = /llms.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://app-api;
    }

    # 机器可读全文（Markdown）：给不执行 JS 的 AI 爬虫与终端工具使用
    location ^~ /md/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=600" always;
        proxy_pass http://app-api;
    }

    # -------------------------------------------------------------------------
    # 前端静态资源（Vite 产物带 hash，可长缓存）
    # -------------------------------------------------------------------------
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 上传文件：直接读挂载目录；强制下载语义 + CSP 沙箱，避免同源执行脚本
    # -------------------------------------------------------------------------
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # -------------------------------------------------------------------------
    # SPA 兜底（前端 history 路由刷新不 404；index.html 不缓存）
    # -------------------------------------------------------------------------
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

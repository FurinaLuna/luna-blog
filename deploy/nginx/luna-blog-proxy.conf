# =============================================================================
# luna-blog-proxy.conf — 反向代理到本机后端（127.0.0.1:3000）的公共片段
#
# 安装位置：/etc/nginx/snippets/luna-blog-proxy.conf
#
# 注意 X-Forwarded-For 用 $remote_addr 而不是 $proxy_add_x_forwarded_for：
# 本站前面没有可信 CDN/反代，直接使用客户端地址，避免被伪造头污染
#（后端限流/取 IP 依赖这个值）。
# =============================================================================
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

# 后端返回 JSON/流式内容时不做缓冲，降低首字节延迟
proxy_buffering off;

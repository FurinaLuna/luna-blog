# =============================================================================
# luna-blog.conf — Luna Blog 站点配置（备案期：纯 HTTP + /admin/ 仅本机）
#
# 安装位置：/etc/nginx/sites-available/luna-blog
# 启用：
#   sudo ln -sfn /etc/nginx/sites-available/luna-blog /etc/nginx/sites-enabled/luna-blog
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 依赖两个片段：
#   /etc/nginx/snippets/luna-blog-headers.conf
#   /etc/nginx/snippets/luna-blog-proxy.conf
#
# 说明：
#   * limit_req_zone / limit_conn_zone / upstream 必须在 http 上下文；
#     sites-enabled 是被 include 进 http 块的，所以写在本文件顶部合法。
#     （不要在 conf.d 里再定义同名 zone，否则 nginx -t 报 duplicate zone）
#   * /admin/ 与 /api/admin/ 只允许 127.0.0.1 / ::1，备案期通过 SSH 隧道访问：
#       ssh -N -L 8080:127.0.0.1:80 ubuntu@43.143.72.12
#       浏览器打开 http://127.0.0.1:8080/admin/
#   * 备案通过后切 HTTPS：改 server_name、加 443 server 块、certbot 申请证书，
#     步骤见 docs/ops/RUNBOOK.md「备案后切 HTTPS」。
# =============================================================================

# ---- 限流 zone（http 上下文）------------------------------------------------
# 通用 API：每 IP 20 请求/秒
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
# 访客可写接口（评论/留言/友链申请/访问上报/点赞）：每 IP 2 请求/秒
limit_req_zone $binary_remote_addr zone=api_write:10m rate=2r/s;
# 登录：每 IP 6 次/分钟
limit_req_zone $binary_remote_addr zone=api_login:10m rate=6r/m;
# 单 IP 并发连接数
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

# ---- 后端 upstream ----------------------------------------------------------
upstream luna_blog_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 备案期用 IP；备案通过后改成：server_name example.com 43.143.72.12;
    server_name 43.143.72.12 _;

    server_tokens off;
    charset utf-8;

    root /var/www/luna-blog/current/web;
    index index.html;

    # 后端限制图片 5MB / 文件 10MB，这里留余量（超出由 Nginx 直接 413）
    client_max_body_size 12m;

    access_log /var/log/nginx/luna-blog.access.log;
    error_log  /var/log/nginx/luna-blog.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # 服务器级安全头；注意：任何自定义了 add_header 的 location 都不会继承它，
    # 因此下面凡是写 add_header 的 location 都重新 include 了 headers 片段。
    include snippets/luna-blog-headers.conf;

    # -------------------------------------------------------------------------
    # 后台（Vue SPA，base=/admin/）
    # -------------------------------------------------------------------------
    location = /admin {
        include snippets/luna-blog-headers.conf;
        return 301 /admin/;
    }

    # 后台带 hash 的静态资源：长缓存
    location ^~ /admin/assets/ {
        root /var/www/luna-blog/current;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    # 后台其余路径：回落 /admin/index.html（SPA 路由）
    location ^~ /admin/ {
        root /var/www/luna-blog/current;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------
    # 登录：单独限频 6r/m（防撞库）
    location = /api/auth/login {
        include snippets/luna-blog-headers.conf;
        limit_req zone=api_login burst=3 nodelay;
        limit_conn perip 5;
        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    # 后台管理 API：仅本机（备案期走 SSH 隧道）
    location ^~ /api/admin/ {
        include snippets/luna-blog-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    # 访客可写接口：单独限频，防刷评论 / 刷点赞 / 刷访问量
    location ~ ^/api/(comments|messages|friend-links|visit|articles/[0-9]+/like|comments/[0-9]+/like|talks/[0-9]+/like|messages/[0-9]+/like)$ {
        include snippets/luna-blog-headers.conf;
        limit_req zone=api_write burst=5 nodelay;
        limit_conn perip 10;
        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    # 其它 API：通用限频 20r/s
    location /api/ {
        include snippets/luna-blog-headers.conf;
        limit_req zone=api_general burst=40 nodelay;
        limit_conn perip 20;
        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    # -------------------------------------------------------------------------
    # SEO / 订阅（由后端动态生成，必须反代，否则被 SPA 兜底成 HTML）
    # -------------------------------------------------------------------------
    location = /robots.txt {
        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    location = /sitemap.xml {
        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    location = /rss.xml {
        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "public, max-age=1800" always;
        include snippets/luna-blog-proxy.conf;
        proxy_pass http://luna_blog_api;
    }

    # -------------------------------------------------------------------------
    # 前端静态资源（Vite 产物带 hash，可长缓存）
    # -------------------------------------------------------------------------
    location /assets/ {
        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 上传文件：alias 指向 data/uploads（不走 current 软链，发布不搬家）
    # 强制下载语义 + CSP 沙箱，避免上传内容在同源下执行脚本
    # -------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/luna-blog/data/uploads/;
        autoindex off;

        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # -------------------------------------------------------------------------
    # SPA 兜底（前端 history 路由刷新不 404；index.html 不缓存）
    # -------------------------------------------------------------------------
    location / {
        include snippets/luna-blog-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# luna-blog-headers.conf — 通用安全响应头
#
# 安装位置：/etc/nginx/snippets/luna-blog-headers.conf
#
# 重要（nginx 继承规则）：只要某个 location 里出现了 add_header，
# 该 location 就不会再继承上层（server/http）的 add_header。
# 因此凡是自己写了 add_header 的 location，都必须重新 include 本文件。
# =============================================================================
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

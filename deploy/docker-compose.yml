# =============================================================================
# docker-compose.yml - Luna Blog production stack (MySQL + API + Nginx)
#
# Layout on the server: /var/www/luna-blog
#   docker-compose.yml   this file            (root:root 644)
#   api.env              API env vars         (copied from docker/api.env.example, 600)
#   compose.env          compose interpolation (MYSQL_ROOT_PASSWORD / DB_* , 600)
#   src/                 repo source (build context)
#
# Common commands:
#   docker compose --env-file compose.env up -d --build
#   docker compose --env-file compose.env ps
#   docker compose --env-file compose.env logs -f api
#   docker compose --env-file compose.env down
#
# Data:
#   mysql-data (named volume)               -> MySQL datadir
#   /var/www/luna-blog/data/uploads (bind)  -> blog uploads (shared read-only with nginx)
# =============================================================================
name: luna-blog

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?compose.env missing MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-luna_blog}
      MYSQL_USER: ${DB_USER:-luna_blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:?compose.env missing DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [luna]

  api:
    build:
      context: ./src
      dockerfile: docker/api.Dockerfile
    image: ${API_IMAGE:-luna-blog-api:local}
    # Run as the host uploads owner (luna-blog uid:gid) so /data/uploads stays readable by nginx
    user: "${APP_UID:-999}:${APP_GID:-987}"
    restart: unless-stopped
    env_file:
      - ./api.env
    environment:
      # Override connection info from api.env: reach MySQL through the compose network
      DB_HOST: db
      DB_PORT: "3306"
      UPLOAD_DIR: /data/uploads
    volumes:
      - ${UPLOAD_HOST_DIR:-/var/www/luna-blog/data/uploads}:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [luna]

  web:
    build:
      context: ./src
      dockerfile: docker/web.Dockerfile
    image: ${WEB_IMAGE:-luna-blog-web:local}
    restart: unless-stopped
    ports:
      # Public 80 + admin tunnel on 127.0.0.1:8080 (localhost only)
      - "80:80"
      - "127.0.0.1:8080:80"
    volumes:
      - ${UPLOAD_HOST_DIR:-/var/www/luna-blog/data/uploads}:/data/uploads:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [luna]

volumes:
  mysql-data:

networks:
  luna:
    driver: bridge
